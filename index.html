function useSharedPacking() {
  const [checked, setChecked] = useState({});
  const [online, setOnline] = useState(true);
  const pull = useCallback(async () => {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (r.ok) { setChecked(await r.json()); setOnline(true); }
    } catch (e) { setOnline(false); }
  }, []);
  useEffect(() => { pull(); }, [pull]);
  useEffect(() => {
    const iv = setInterval(() => { if (!document.hidden) pull(); }, 3000);
    return () => clearInterval(iv);
  }, [pull]);
  const send = async (payload, optimistic) => {
    setChecked(optimistic);
    try {
      const r = await fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (r.ok) { setChecked(await r.json()); setOnline(true); }
    } catch (e) { setOnline(false); }
  };
  const toggle = useCallback((id) => {
    setChecked((prev) => {
      const n = { ...prev }; if (n[id]) delete n[id]; else n[id] = 1;
      send({ op: "toggle", id }, n);
      return n;
    });
  }, []);
  const reset = useCallback(() => { send({ op: "reset" }, {}); }, []);
  return { checked, toggle, reset, online };
}

function Gauge({ done, total }) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  const deg = (pct / 100) * 360;
  return (
    <div className="gauge-card">
      <div className="gauge" style={{ background: `conic-gradient(${C.larch} ${deg}deg, ${C.paper2} 0deg)` }}>
        <div className="num mono">{pct}<small>%</small></div>
      </div>
      <div className="gauge-txt">
        <div className="big">Sbaleno {done} z {total}</div>
        <div className="small">Sdílené věci vidí celá parta, osobní má každý svoje.</div>
      </div>
    </div>
  );
}

      <span className={`blaze${pop ? " pop" : ""}`} />
      <span className="label">{label}{note && <span className="note-lend"> · {note}</span>}</span>
    </button>
  );
}

function PersonRow({ cid, idx, label, checked, onToggle }) {
  const allDone = PEOPLE.every((p) => checked[personId(cid, idx, p.name)]);
  return (

              {p.name}

  );
}

function ElevationProfile() {
  const W = 100, H = 46, padT = 4, padB = 2;
  const xs = PROF.map((p) => p[0]), es = PROF.map((p) => p[1]);
  const kmMax = xs[xs.length - 1], eMin = Math.min(...es), eMax = Math.max(...es);
  const X = (km) => (km / kmMax) * W;
  const Y = (e) => padT + (1 - (e - eMin) / (eMax - eMin)) * (H - padT - padB);
  const line = PROF.map((p) => `${X(p[0]).toFixed(2)},${Y(p[1]).toFixed(2)}`).join(" ");
  const area = `0,${H} ${line} ${W},${H}`;
  const sIdx = es.indexOf(eMax);
  const sx = X(PROF[sIdx][0]), sy = Y(PROF[sIdx][1]);
  return (
    <div>
      <div className="viz-label"><span>Výškový profil</span><span className="mono">{GPX.km} km</span></div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }} preserveAspectRatio="none">
        <defs>
          <linearGradient id="elg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor={C.lake} stopOpacity="0.55" />
            <stop offset="1" stopColor={C.spruce} stopOpacity="0.12" />
          </linearGradient>
        </defs>
        <polygon points={area} fill="url(#elg)" />
        <polyline points={line} fill="none" stroke={C.spruce} strokeWidth="1" vectorEffect="non-scaling-stroke" />
        <circle cx={sx} cy={sy} r="2.2" fill={C.blaze} stroke="#fff" strokeWidth="0.8" />
      </svg>
      <div className="viz-cap">Start a cíl u chaty Valvasorjev dom ({PROF[0][1]} m), vrchol Stol červeně (2236 m).</div>
    </div>
  );
}

function RouteShape() {
  const size = 100, pad = 8;
  const latMid = ROUTE.reduce((s, p) => s + p[0], 0) / ROUTE.length;
  const k = Math.cos((latMid * Math.PI) / 180);
  const proj = ROUTE.map(([la, lo]) => [lo * k, la]);
  const xsV = proj.map((p) => p[0]), ysV = proj.map((p) => p[1]);
  const minX = Math.min(...xsV), maxX = Math.max(...xsV), minY = Math.min(...ysV), maxY = Math.max(...ysV);
  const span = Math.max(maxX - minX, maxY - minY);
  const sc = (size - 2 * pad) / span;
  const offX = pad + ((size - 2 * pad) - (maxX - minX) * sc) / 2;
  const offY = pad + ((size - 2 * pad) - (maxY - minY) * sc) / 2;
  const P = (p) => [offX + (p[0] - minX) * sc, size - (offY + (p[1] - minY) * sc)];
  const pts = proj.map(P);
  const line = pts.map((p) => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(" ");
  const es = PROF.map((p) => p[1]); const sIdx = es.indexOf(Math.max(...es));
  const start = pts[0], summit = P(proj[sIdx]);
  return (
    <div>
      <div className="viz-label"><span>Tvar trasy</span><span className="mono">okruh</span></div>
      <div className="route-wrap">
        <svg viewBox={`0 0 ${size} ${size}`} width="72%" style={{ maxWidth: 260 }}>
          <polyline points={line} fill="none" stroke={C.lake} strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round" />
          <circle cx={summit[0]} cy={summit[1]} r="3.6" fill={C.blaze} stroke="#fff" strokeWidth="1.2" />
          <circle cx={start[0]} cy={start[1]} r="3.2" fill={C.spruce} stroke="#fff" strokeWidth="1.2" />
        </svg>
      </div>
      <div className="viz-cap">Zelený bod je start u chaty, červený je vrchol Stol.</div>
    </div>
  );
}

              <li className="tip"><span className="mk" /><span><b>Před Stolem lehčí varianta:</b> jogurt nebo kaše s ovocem, ať nejsi po ránu těžký na výstup.</span></li>
            </ul>

            <h2 className="h2">Večeře</h2>
            <ul className="tiplist">
              <li className="tip"><span className="mk" /><span><b>Buřtguláš z jednoho hrnce:</b> cibule, kolečka buřtů, sladká paprika, brambory, protlak a voda. Za půl hodiny hustý guláš k chlebu.</span></li>
              <li className="tip"><span className="mk" /><span><b>Selská pánev:</b> vyškvařená slanina, brambory na kostky do zlatova, nakonec zaklopit vajíčky.</span></li>
              <li className="tip"><span className="mk" /><span><b>Předvařený guláš z domova:</b> uvař oblíbený guláš předem, v kempu jen ohřeješ. Druhý den nejlepší.</span></li>
              <li className="tip"><span className="mk" /><span><b>Slaninová frittata:</b> vajíčka se slaninou, cibulí a sýrem, nechat ztuhnout pod pokličkou.</span></li>
              <li className="tip"><span className="mk" /><span><b>Špekáčky a buřty z grilu:</b> naříznout do kříže, opéct nad ohněm, k tomu hořčice, cibule a chleba.</span></li>
            </ul>

            <div className="card" style={{ marginTop: 18 }}>
              <b style={{ fontSize: 14 }}>Na nákup nezapomeň</b>
              <p className="lead" style={{ marginTop: 6 }}>Vajíčka, slanina, buřty a párky, cibule, brambory, sladká paprika, protlak, chleba, hořčice, olej nebo sádlo. Vaření a nádobí najdeš v seznamu Balení.</p>
            </div>
          </>
        )}

        {tab === "tipy" && (
          <>
            <h2 className="h2">Praktické tipy</h2>
            <ul className="tiplist">
              <li className="tip warn"><span className="mk" /><span><b>Počasí:</b> přes den fajn, noci klidně 3 až 8 °C. Zkontroluj předpověď pár dní předem.</span></li>
              <li className="tip"><span className="mk" /><span><b>Klíšťata</b> jsou na podzim pořád aktivní, repelent a pinzeta se hodí.</span></li>
              <li className="tip warn"><span className="mk" /><span><b>Vintgar:</b> do soutěsky psi nesmí, na trek s Agy ji vynech.</span></li>
              <li className="tip"><span className="mk" /><span><b>Voda pro Agy</b> na každý výlet, prameny na hřebeni nejsou.</span></li>
              <li className="tip"><span className="mk" /><span><b>Nabitý telefon</b> a stažené mapy nebo GPX, nahoře bývá slabý signál.</span></li>
            </ul>

            <h2 className="h2">Kdyby něco</h2>
            <div className="card"><p className="lead" style={{ marginTop: 0 }}>Tísňová linka ve Slovinsku i horská služba: <b className="mono" style={{ fontSize: 15 }}>112</b>. Řekni polohu (souřadnice z mapy v mobilu), počet lidí a co se stalo.</p></div>

            <h2 className="h2">Další treky u Bledu</h2>
            <ul className="tiplist">
              <li className="tip"><span className="mk" /><span><b>Debela peč (2014 m):</b> hřebenovka z Pokljuky, střední, super výhledy, s Agy v pohodě.</span></li>
              <li className="tip"><span className="mk" /><span><b>Viševnik (2050 m):</b> kratší a strmý, nejlepší pohled na Triglav.</span></li>
              <li className="tip"><span className="mk" /><span><b>Okruh kolem jezera:</b> pohodový půlden s výstupem na vyhlídky Ojstrica a Mala Osojnica.</span></li>
            </ul>
          </>
        )}

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
